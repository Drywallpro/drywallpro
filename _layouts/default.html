<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X2LPRWH41X"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

        gtag('consent', 'default', {
            'analytics_storage': 'denied',
            'wait_for_update': 500
        });

        gtag('js', new Date());
        gtag('config', 'G-X2LPRWH41X');
    </script>
    {% seo %}
    {% include schema-local-business.html %}
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles/style.css">
    {% if page.styles %}<link rel="stylesheet" href="styles/{{ page.styles }}">{% endif %}
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vanilla-cookieconsent@3.0.1/dist/cookieconsent.css" media="print" onload="this.media='all'">
</head>
<body>
    {% include header.html %}

    {{ content }}

    {% include footer.html %}

    <script src="scripts/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanilla-cookieconsent@3.0.1/dist/cookieconsent.umd.js" defer></script>
    <script src="scripts/cookieconsent.js" defer></script>
    {% if page.extra_scripts %}
    {% for src in page.extra_scripts %}
    <script src="{{ src }}"></script>
    {% endfor %}
    {% endif %}
    {% if page.formspree_form %}
    <script>
        window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
        formspree('initForm', { formElement: '{{ page.formspree_form }}', formId: '{{ page.formspree_id | default: "xlgwkvyo" }}' });
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
    {% endif %}
</body>
</html>
